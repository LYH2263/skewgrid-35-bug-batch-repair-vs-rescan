server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /tiles/ {
        proxy_pass http://backend:8100/tiles/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
